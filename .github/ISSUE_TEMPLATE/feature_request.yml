name: Feature request
description: Suggest an idea that would help contributors or maintainers.
labels: [enhancement]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and discussions and this has not been suggested yet.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who is it for (first-time contributor, maintainer, …) and what is hard today? A real example helps most.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like CONTRI to do?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What GitHub data would it use?
      description: CONTRI only shows public evidence it can link to. Rough request cost for anonymous users (60 requests an hour) helps too.
  - type: dropdown
    id: ai
    attributes:
      label: Did you use an AI tool to write this request?
      options:
        - 'No'
        - 'Yes'
    validations:
      required: true
  - type: checkboxes
    id: help
    attributes:
      label: Contribution
      options:
        - label: I'd like to work on this myself
